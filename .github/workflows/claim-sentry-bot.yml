name: ClaimSentry Bot Triage

on:
  issues:
    types: [opened, reopened]
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Specific Issue or PR number to audit'
        required: false

jobs:
  triage:
    name: Autonomous Sandbox Verification
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytesseract

      - name: Run ClaimSentry Claim Audit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_NUM="${{ github.event.issue.number || github.event.pull_request.number || github.event.inputs.issue_number }}"
          echo "Auditing Issue/PR #${ISSUE_NUM} on ${{ github.repository }}..."
          python -m claim_sentry.bot \
            --repo "${{ github.repository }}" \
            --issue "${ISSUE_NUM}" \
            --comment
